[supervisord]
nodaemon        = true
user            = root
loglevel        = info
logfile         = /dev/null
logfile_maxbytes= 0
pidfile         = /run/supervisord.pid

[unix_http_server]
file  = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

# --- 1) Base de datos ---------------------------------------------------------
[program:mysqld]
command          = /usr/sbin/mysqld --defaults-file=/etc/mysql/my.cnf
priority         = 10
autostart        = true
autorestart      = true
startsecs        = 5
stopsignal       = TERM
stopwaitsecs     = 60
stdout_logfile   = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr  = true

# --- 2) API ASP.NET Core (espera a MySQL, migra y arranca Kestrel) -----------
[program:api]
command          = /usr/local/bin/fcqi-start-api.sh
priority         = 20
autostart        = true
autorestart      = true
startsecs        = 10
stopwaitsecs     = 30
stdout_logfile   = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr  = true

# --- 3) Servidor web / proxy inverso -----------------------------------------
[program:nginx]
command          = /usr/sbin/nginx -g "daemon off;"
priority         = 30
autostart        = true
autorestart      = true
startsecs        = 3
stopsignal       = QUIT
stdout_logfile   = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr  = true

# Si un proceso queda en estado FATAL, el contenedor termina en lugar de
# quedarse "arriba" pero inservible.
[eventlistener:fatal_watcher]
command = /usr/local/bin/fcqi-fatal-watcher.sh
events  = PROCESS_STATE_FATAL
